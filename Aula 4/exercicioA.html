<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício A</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      .header{
        display: flex;
        justify-content: start;
        align-items: start;
        margin-left: 24px;
        flex-direction: column;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .header h1{
        text-transform: capitalize;
        color: balck;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Vendas por Mês</h1>
      <a href="https://www.kaggle.com/datasets/yohanan/monthly-sales">
        <button type="button">Acessar Dataset</button>
      </a>
    </div>
    <div id="barchart">
    </div>

    <script>
      var data = [
        ["2013-01-01", 14236.9],
        ["2013-02-01", 4519.89],
        ["2013-03-01", 55691.01],
        ["2013-04-01", 28295.35],
        ["2013-05-01", 23648.29],
        ["2013-06-01", 34595.13],
        ["2013-07-01", 33946.39],
        ["2013-08-01", 27909.47],
        ["2013-09-01", 81777.35],
        ["2013-10-01", 31453.39],
        ["2013-11-01", 78628.72],
        ["2013-12-01", 69545.62],
        ["2014-01-01", 18174.08],
        ["2014-02-01", 11951.41],
        ["2014-03-01", 38726.25],
        ["2014-04-01", 34195.21],
        ["2014-05-01", 30131.69],
        ["2014-06-01", 24797.29],
        ["2014-07-01", 28765.33],
        ["2014-08-01", 36898.33],
        ["2014-09-01", 64595.92],
        ["2014-10-01", 31404.92],
        ["2014-11-01", 75972.56],
        ["2014-12-01", 74919.52],
        ["2015-01-01", 18542.49],
        ["2015-02-01", 22867.71],
        ["2015-03-01", 51186.22],
        ["2015-04-01", 39248.59],
        ["2015-05-01", 56691.08],
        ["2015-06-01", 39430.44],
        ["2015-07-01", 38440.76],
        ["2015-08-01", 33265.56],
        ["2015-09-01", 72908.11],
        ["2015-10-01", 56463.13],
        ["2015-11-01", 82192.32],
        ["2015-12-01", 97237.42],
        ["2016-01-01", 44703.14],
        ["2016-02-01", 20301.13],
        ["2016-03-01", 58872.35],
        ["2016-04-01", 36521.54],
        ["2016-05-01", 44261.11],
        ["2016-06-01", 52981.73],
        ["2016-07-01", 45264.42],
        ["2016-08-01", 63120.89],
        ["2016-09-01", 87866.65],
        ["2016-10-01", 77776.92],
        ["2016-11-01", 118447.83],
        ["2016-12-01", 83829.32],
      ];

      const height = 400
      const width = 100
      const barWidth = 20
      const padding = 2

      function getCorPorMes(number){
        const cores = ['#1f77b4', '#ff7f0e', '#abcd81', '#162728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf', '#aec7e8', '#ffbb78']
        return cores[number-1]
      }

      function getCorPorAno(index){
        const cores = ['#4A5568', '#2B6CB0', '#2F855A', '#A8DADC']
        return cores[index]
      }

      function getNumMes(data){
        return Number(data.split('-')[1])
      }

      function getNumAno(data){
        return Number(data.split('-')[0])
      }

      function calcularMediaAno(dados){
        let res = {
          2013: 0,
          2014: 0,
          2015: 0,
          2016: 0
        }
        let cont = {
          2013: 0,
          2014: 0,
          2015: 0,
          2016: 0
        }
        dados.forEach(dado => {
          const numAno = getNumAno(dado[0])
          res[numAno] += dado[1]
          cont[numAno]++
        });

        for(const [chave, valor] of Object.entries(res)){
          res[chave] = Number((valor / cont[chave]).toFixed(2))
        }

        return res
      }

      function calculaPosicoesLinhas(medias){
        let res = []
        for(const [chave, valor] of Object.entries(medias)){
          res.push([(barWidth + padding) * 12 * (chave - 2013) + (barWidth + padding) * 6, 50 + valor / 1000])
        }

        return res
      }

      function getMaiorVenda(dados){
        let dataMaior = ''
        let maior = 0
        dados.forEach(dado => {
          if(dado[1] > maior){
            maior = dado[1]
            dataMaior = dado[0]
          }
        })
        return dataMaior
      }

      function getMenorVenda(dados){
        let dataMenor = ''
        let menor = Infinity
        dados.forEach(dado => {
          if(dado[1] < menor){
            menor = dado[1]
            dataMenor = dado[0]
          }
        })
        return dataMenor
      }

      var dataMaiorVenda = getMaiorVenda(data)
      var dataMenorVenda = getMenorVenda(data)

      var svg = d3.select("#barchart").append('svg').attr('height', height).attr('width', `${width}%`)

      var colunas = svg.selectAll('g').data(data).enter().append('g')

      var rotulos = colunas.append('text')
                           .text(d => d[0])
                           .attr('stroke', 'black')
                           .attr('x', (d,i) => barWidth * i + padding * i)
                           .attr('y', d => height - (d[1] / 1000))
                           .attr('transform', (d,i) => `rotate(90, ${barWidth * i + padding * i}, ${height - (d[1] / 1000)}) translate(-90, -5)`)
                           .attr('font-family', 'Segoe UI')

      var barras = colunas.append('rect')
                          .attr('x', (d,i) => barWidth * i + padding * i)
                          .attr('y', d => height - (d[1] / 1000))
                          .attr('width', barWidth)
                          .attr('height', d => d[1] / 1000)
                          .attr('fill', d => {
                            if(d[0] == dataMaiorVenda) return 'green'
                            if(d[0] == dataMenorVenda) return 'red'
                            const numMes = getNumMes(d[0])
                            return getCorPorMes(numMes)
                          })
      
      var s = calculaPosicoesLinhas(calcularMediaAno(data))
      var linha = d3.line()
      svg.append('path')
          .attr('d', linha(s))
          .attr('stroke', 'black')
          .attr('fill', 'none')

      svg.selectAll('circle')
          .data(s)
          .enter()
          .append('circle')
          .attr('cx', d => d[0])
          .attr('cy', d => d[1])
          .attr('r', '10')
          .attr('fill', (d,i) => getCorPorAno(i))
    </script>
  </body>
</html>
