<!doctype html>
<html lang="pt_BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício B</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <div id="heatmap"></div>
    <script>
        const acessos = [
            { dia: "Segunda", hora: "08h", valor: 35 },
            { dia: "Segunda", hora: "12h", valor: 52 },
            { dia: "Segunda", hora: "18h", valor: 78 },
            { dia: "Segunda", hora: "22h", valor: 61 },
            { dia: "Terça", hora: "08h", valor: 42 },
            { dia: "Terça", hora: "12h", valor: 48 },
            { dia: "Terça", hora: "18h", valor: 85 },
            { dia: "Terça", hora: "22h", valor: 67 },
            { dia: "Quarta", hora: "08h", valor: 38 },
            { dia: "Quarta", hora: "12h", valor: 55 },
            { dia: "Quarta", hora: "18h", valor: 91 },
            { dia: "Quarta", hora: "22h", valor: 73 },
            { dia: "Quinta", hora: "08h", valor: 45 },
            { dia: "Quinta", hora: "12h", valor: 50 },
            { dia: "Quinta", hora: "18h", valor: 88 },
            { dia: "Quinta", hora: "22h", valor: 70 },
            { dia: "Sexta", hora: "08h", valor: 51 },
            { dia: "Sexta", hora: "12h", valor: 63 },
            { dia: "Sexta", hora: "18h", valor: 95 },
            { dia: "Sexta", hora: "22h", valor: 82 },
            { dia: "Sábado", hora: "08h", valor: 58 },
            { dia: "Sábado", hora: "12h", valor: 76 },
            { dia: "Sábado", hora: "18h", valor: 89 },
            { dia: "Sábado", hora: "22h", valor: 93 },
            { dia: "Domingo", hora: "08h", valor: 47 },
            { dia: "Domingo", hora: "12h", valor: 69 },
            { dia: "Domingo", hora: "18h", valor: 84 },
            { dia: "Domingo", hora: "22h", valor: 87 },
        ];

        const height = 500, width = 600, margin = { top: 50, right: 80, bottom: 100, left: 80 }, titleWidth = 50

        var svg = d3.select('#heatmap')
                    .append('svg')
                    .attr('width', width + margin.left + margin.right)
                    .attr('height', height + margin.top + margin.bottom)
                    .append('g')
                    .attr('transform', `translate(${margin.left}, ${margin.top})`)
        
        // arrays para os eixos
        var horas = Array.from(new Set(acessos.map(acesso => acesso.hora)))
        var dias = Array.from(new Set(acessos.map(acesso => acesso.dia)))

        const x = d3.scaleBand()
                    .domain(horas)
                    .range([0,width])
                    .padding(0.05)
        
        svg.append('g')
            .call(d3.axisBottom(x).tickSize(0))
            .attr('transform', `translate(${titleWidth},${height + titleWidth})`)
            .attr('font-family', 'Segoe UI')
        
        const y = d3.scaleBand()
                    .domain(dias)
                    .range([0,height])
                    .padding(0.05)

        svg.append('g')
            .call(d3.axisLeft(y).tickSize(0))
            .attr('transform', `translate(${titleWidth}, ${titleWidth})`)
            .attr('font-family', 'Segoe UI')

        const cores = d3.scaleSequential()
                        .interpolator(d3.interpolateBlues)
                        .domain([0, d3.max(acessos, d => d.valor)])
        
        svg.append('g')
            .attr('transform', `translate(${titleWidth},${titleWidth})`)
            .selectAll('rect')
            .data(acessos)
            .enter()
            .append('rect')
            .attr('x', d => x(d.hora))
            .attr('y', d => y(d.dia))
            .attr('width', x.bandwidth())
            .attr('height', y.bandwidth())
            .attr('fill', d => cores(d.valor))
            .attr('rx', 4)
            .attr('ry', 4)
        
        svg.append("text")
            .attr("x", margin.left - 10)
            .attr("y", 0)
            .attr("text-anchor", "left")
            .attr('font-family', 'Segoe UI')
            .style("font-size", "22px")
            .text("Heatmap de Acessos de Streaming")

        // Add subtitle to graph
        svg.append("text")
                .attr("x", margin.left - 10)
                .attr("y", 20)
                .attr("text-anchor", "left")
                .attr('font-family', 'Segoe UI')
                .style("font-size", "14px")
                .style("fill", "grey")
                .style("max-width", 400)
                .text("Distribuição dos acessos a partir dos dias e horários")
    </script>
  </body>
</html>
