<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo da Aula</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <script>
      Promise.all([d3.csv("./cities.csv"), d3.csv("./dados.csv")]).then(function (data) {
        console.log(data)
        var table = d3.select("body").append("table").selectAll("tr");
        var tr = table.data(data[0]).enter().append("tr");
        var td = tr
          .selectAll("td")
          .data(function (d) {
            return [d.city, d.state, d.population, d["land area"]];
          })
          .enter()
          .append("td")
          .text(function (d) {
            return d;
          });
        table = d3.select("body").append("table").selectAll("tr");
        tr = table.data(data[1]).enter().append("tr");
        td = tr
          .selectAll("td")
          .data(function (d) {
            return [d.Nome, d.Idade];
          })
          .enter()
          .append("td")
          .text(function (d) {
            return d;
          });
      });
    </script>
  </body>
</html>
